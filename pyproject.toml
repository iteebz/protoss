[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protoss"
version = "0.1.0"
description = "Constitutional AI coordination through emergent agent swarms."
authors = [{name = "Tyson Chan", email = "tyson.chan@proton.me"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
keywords = ["ai", "agents", "protoss", "coordination", "distributed", "cognition", "autonomous", "multiagent", "starcraft", "psionic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.17.4",
    "cogency",
]

[tool.uv.sources]
cogency = { path = "../cogency", editable = true }

[project.scripts]
protoss = "protoss.cli:app"

[project.urls]
homepage = "https://github.com/iteebz/protoss"
repository = "https://github.com/iteebz/protoss"

[tool.hatch.build.targets.wheel]
packages = ["src/protoss"]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pyright>=1.1.407",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
]
ignore = [
    "SIM108",
    "SIM117",
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src/protoss"]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportDuplicateImport = true
reportMissingTypeStubs = false
